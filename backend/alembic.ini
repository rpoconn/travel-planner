# Alembic config. The database URL is not set here: migrations/env.py reads DATABASE_URL
# through the app's Settings, so the CLI and the app always target the same database.
#
#   uv run alembic upgrade head                          # apply migrations (the app also does this on startup)
#   uv run alembic revision --autogenerate -m "add x"    # after changing an ORM model

[alembic]
script_location = %(here)s/migrations
# `src/` is the import root (see pyproject.toml), so env.py can import `shared` / `features`.
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging for CLI runs only; when the app runs migrations it keeps its own logging setup.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
