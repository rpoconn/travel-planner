[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "Travel itinerary chatbot API backed by a local Ollama model"
readme = "../README.md"
authors = [
    { name = "Ryan O'Connell", email = "rpoconn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

# `src/` is the import root (not an installable package): modules are imported
# as `shared.*`, `features.*`, and `main`. pytest/mypy/uvicorn all point at it.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "features", "main"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ollama: integration tests that require a running Ollama server (deselected by default)",
]
addopts = "-m 'not ollama'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
